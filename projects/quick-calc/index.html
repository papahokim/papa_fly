<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0b08">
  <title>재패니즈 패치 계산기 — PAPAFLY</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-lg); }
    .calc-wrap { width: 100%; max-width: 480px; }
    .calc-header { text-align: center; margin-bottom: var(--space-xl); }
    .calc-header h1 { font-family: var(--font-heading); font-size: 1.5rem; color: var(--text); }
    .calc-header p  { font-size: 0.8rem; color: var(--text-muted); margin-top: var(--space-xs); }

    .field { margin-bottom: var(--space-md); }
    .field label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.05em; }
    .field input, .field select {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: var(--space-sm) var(--space-md);
      font-family: var(--font-body); font-size: 1rem;
      outline: none; transition: border-color var(--duration);
    }
    .field input:focus, .field select:focus { border-color: var(--gold); }

    .result-box {
      background: var(--surface); border: 1px solid var(--border);
      padding: var(--space-lg); margin: var(--space-lg) 0;
    }
    .result-row { display: flex; justify-content: space-between; align-items: center; padding: var(--space-xs) 0; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    .result-row:last-child { border-bottom: none; }
    .result-row .label { color: var(--text-muted); }
    .result-row .value { color: var(--text); font-weight: 500; }
    .result-row.highlight .value { color: var(--gold); font-size: 1.1rem; font-weight: 600; }
    .result-row.margin-ok .value { color: var(--ch3); }
    .result-row.margin-low .value { color: var(--vermillion); }

    .patch-tag {
      font-size: 0.7rem; color: var(--gold); letter-spacing: 0.15em;
      text-align: center; margin-bottom: var(--space-md);
    }
    .back-link { display: block; text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: var(--space-lg); }
    .back-link:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="calc-wrap">
    <div class="calc-header">
      <p class="patch-tag">재패니즈 패치 — JAPANESE PATCH</p>
      <h1>매입원가 계산기</h1>
      <p>JPY 매입가 → KRW 원가/마진 자동 계산</p>
    </div>

    <div class="field">
      <label>매입가 (엔화 ¥)</label>
      <input type="number" id="jpy" placeholder="예: 3500" min="0">
    </div>

    <div class="field">
      <label>환율 (¥1 = ₩)</label>
      <input type="number" id="rate" value="9.2" step="0.1" min="1">
    </div>

    <div class="field">
      <label>추가 비용 (배송+통관 등 ₩)</label>
      <input type="number" id="extra" placeholder="예: 5000" min="0" value="0">
    </div>

    <div class="field">
      <label>목표 마진율 (%)</label>
      <input type="number" id="margin" placeholder="예: 60" min="0" max="99" value="60">
    </div>

    <div class="result-box" id="result">
      <div class="result-row"><span class="label">JPY 매입가</span><span class="value" id="r-jpy">—</span></div>
      <div class="result-row"><span class="label">KRW 환산</span><span class="value" id="r-krw-base">—</span></div>
      <div class="result-row"><span class="label">총 원가 (환산 + 추가비용)</span><span class="value" id="r-cost">—</span></div>
      <div class="result-row highlight"><span class="label">권장 판매가</span><span class="value" id="r-sell">—</span></div>
      <div class="result-row" id="r-margin-row"><span class="label">실제 마진율</span><span class="value" id="r-margin">—</span></div>
      <div class="result-row"><span class="label">마진 금액</span><span class="value" id="r-profit">—</span></div>
    </div>

    <a href="../../index.html" class="back-link">← PAPAFLY 홈</a>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const fmt = n => '₩' + Math.round(n).toLocaleString();

    function calc() {
      const jpy    = parseFloat($('jpy').value) || 0;
      const rate   = parseFloat($('rate').value) || 9.2;
      const extra  = parseFloat($('extra').value) || 0;
      const target = parseFloat($('margin').value) || 60;

      const krwBase = jpy * rate;
      const cost    = krwBase + extra;
      const sell    = target > 0 && target < 100 ? cost / (1 - target / 100) : cost;
      const profit  = sell - cost;
      const actual  = sell > 0 ? ((profit / sell) * 100).toFixed(1) : 0;

      $('r-jpy').textContent     = jpy ? `¥${jpy.toLocaleString()}` : '—';
      $('r-krw-base').textContent= jpy ? fmt(krwBase) : '—';
      $('r-cost').textContent    = jpy ? fmt(cost) : '—';
      $('r-sell').textContent    = jpy ? fmt(sell) : '—';
      $('r-margin').textContent  = jpy ? `${actual}%` : '—';
      $('r-profit').textContent  = jpy ? fmt(profit) : '—';

      const row = $('r-margin-row');
      row.className = 'result-row ' + (actual >= target ? 'margin-ok' : 'margin-low');
    }

    ['jpy','rate','extra','margin'].forEach(id => $$(id) && $(id).addEventListener('input', calc));
    function $$(id) { return !!$(id); }
    document.querySelectorAll('input').forEach(el => el.addEventListener('input', calc));
  </script>
</body>
</html>
