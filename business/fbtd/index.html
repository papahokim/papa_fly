<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fBtD | from Baby to Doctor</title>
  <meta name="description" content="fBtD - 아이의 성장을 함께하는 교육 여정. 아기부터 전문가까지.">
  <link rel="icon" href="../../assets/icons/logo.jpg">
  <style>
    :root {
      --bg: #0F1F15;
      --bg-elevated: #1A2E22;
      --bg-card: #243529;
      --accent: #3498DB;
      --gold: #D4AF37;
      --text: #F5F5F0;
      --text-secondary: rgba(245,245,240,.7);
      --text-muted: rgba(245,245,240,.5);
      --border: rgba(245,245,240,.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 100px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--accent);
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .hero-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(52, 152, 219, 0.2);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .section {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-content {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .feature-list {
      list-style: none;
    }

    .feature-list li {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feature-list li:last-child {
      border-bottom: none;
    }

    .feature-icon {
      font-size: 20px;
    }

    .journey {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .journey-step {
      text-align: center;
      flex: 1;
    }

    .journey-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .journey-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .journey-arrow {
      color: var(--accent);
      font-size: 20px;
    }

    .coming-soon {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .coming-soon-badge {
      display: inline-block;
      background: var(--bg-card);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../../" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Home
    </a>

    <div class="hero">
      <img src="../../assets/icons/fbtd.svg" alt="fBtD" class="hero-icon">
      <h1 class="hero-title">fBtD</h1>
      <p class="hero-subtitle">from Baby to Doctor</p>
      <span class="hero-badge">Education Journey</span>
    </div>

    <div class="section">
      <h2 class="section-title">About</h2>
      <p class="section-content">
        아이의 첫 걸음부터 전문가로 성장하기까지.
        각 단계에 맞는 교육과 멘토링으로 성장을 지원합니다.
      </p>
    </div>

    <div class="section">
      <h2 class="section-title">Growth Journey</h2>
      <div class="journey">
        <div class="journey-step">
          <div class="journey-icon">👶</div>
          <div class="journey-label">Baby</div>
        </div>
        <span class="journey-arrow">→</span>
        <div class="journey-step">
          <div class="journey-icon">🧒</div>
          <div class="journey-label">Child</div>
        </div>
        <span class="journey-arrow">→</span>
        <div class="journey-step">
          <div class="journey-icon">👨‍🎓</div>
          <div class="journey-label">Student</div>
        </div>
        <span class="journey-arrow">→</span>
        <div class="journey-step">
          <div class="journey-icon">👨‍⚕️</div>
          <div class="journey-label">Doctor</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2 class="section-title">Programs</h2>
      <ul class="feature-list">
        <li>
          <span class="feature-icon">🌱</span>
          <span>영유아 발달 지원</span>
        </li>
        <li>
          <span class="feature-icon">📖</span>
          <span>학습 습관 형성</span>
        </li>
        <li>
          <span class="feature-icon">🎯</span>
          <span>진로 탐색 멘토링</span>
        </li>
        <li>
          <span class="feature-icon">🏥</span>
          <span>전문직 진학 컨설팅</span>
        </li>
      </ul>
    </div>

    <div class="coming-soon">
      <p>Program Details</p>
      <span class="coming-soon-badge">Coming Soon</span>
    </div>
  </div>
</body>
</html>
