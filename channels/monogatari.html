<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物語 Monogatari — 발굴 스토리 | PAPAFLY</title>
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .ch-header { padding: 120px var(--space-lg) var(--space-xl); text-align: center; border-bottom: 1px solid var(--border); }
    .ch-badge  { font-size: 0.7rem; letter-spacing: 0.2em; color: var(--ch1); margin-bottom: var(--space-md); }
    .ch-title  { font-family: var(--font-heading); font-size: clamp(2.5rem, 6vw, 5rem); color: var(--text); }
    .ch-sub    { font-size: 0.85rem; color: var(--text-muted); margin-top: var(--space-sm); letter-spacing: 0.05em; }
    .stories   { max-width: 720px; margin: 0 auto; padding: var(--space-2xl) var(--space-lg); }
    .story-item { border-left: 2px solid var(--ch1); padding-left: var(--space-lg); margin-bottom: var(--space-xl); }
    .story-patch{ font-size: 0.7rem; color: var(--ch1); letter-spacing: 0.15em; margin-bottom: var(--space-xs); }
    .story-name { font-family: var(--font-heading); font-size: 1.2rem; color: var(--text); margin-bottom: var(--space-sm); }
    .story-text { color: var(--text-muted); line-height: 1.9; font-size: 0.9rem; }
    .story-meta { display: flex; gap: var(--space-md); margin-top: var(--space-sm); font-size: 0.75rem; color: var(--text-dim); }
  </style>
  <!-- PAPAFLY Interactive: GSAP + VanillaTilt + Splitting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/splitting/dist/splitting.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script src="../assets/js/interactive.js"></script>
</head>
<body>
  <nav class="nav">
    <a href="../index.html" class="nav-logo">PAPAFLY</a>
    <div class="nav-links">
      <a href="monogatari.html" style="color:var(--ch1)">物語</a>
      <a href="shitate.html">仕立て</a>
      <a href="coordinate.html">コーデ</a>
      <a href="mekiki.html">目利き</a>
    </div>
  </nav>

  <header class="ch-header">
    <p class="ch-badge">CH.01 — MONOGATARI</p>
    <h1 class="ch-title">物語</h1>
    <p class="ch-sub">상품 발굴 스토리 · 일본 문화 배경 · 재패니즈 패치</p>
  </header>

  <main class="stories" id="stories-container">
    <!-- PF-001 -->
    <article class="story-item">
      <p class="story-patch">재패니즈 패치 #001</p>
      <h2 class="story-name">80s 일본 밀리터리 M-65 필드자켓</h2>
      <p class="story-text">
        오기쿠보 구제 골목 끝 상자 더미에서 꺼냈다.<br>
        미군 지급품이 일본을 거쳐 현지화된 버전. 단추 刻印이 일본어다.<br>
        80년대 일본 젊은이들이 미군 잉여물을 어떻게 소화했는지를 보여주는 물건.
      </p>
      <div class="story-meta">
        <span>도쿄 오기쿠보 플리마켓</span>
        <span>2026-02</span>
        <span>1980s</span>
        <a href="../showroom/lookbook/PF-001.html" style="color:var(--ch1)">쇼룸 →</a>
      </div>
    </article>
  </main>

  <script src="../assets/js/app.js"></script>
</body>
</html>
