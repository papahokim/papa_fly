<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0c" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PAPAFLY — Lite 관리</title>
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .lite-wrap { width: 100%; max-width: 400px; text-align: center; }
    .lite-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px 24px; }
    .lite-logo { font-family: var(--font-heading); font-size: 1.5rem; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 8px; }
    .lite-sub { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 24px; }
    .lite-actions { display: flex; flex-direction: column; gap: 12px; }
    .lite-btn { padding: 14px 24px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .lite-btn:hover { border-color: var(--gold); color: var(--gold); }
    .lite-btn.primary { background: var(--gold); color: var(--bg); border-color: var(--gold); }
    .lite-btn.primary:hover { background: transparent; color: var(--gold); }
  </style>
</head>
<body>
  <div class="lite-wrap">
    <div class="lite-card">
      <div class="lite-logo">PAPAFLY</div>
      <div class="lite-sub">간편 상품관리 포탈</div>
      <div class="lite-actions">
        <a href="../showroom/index.html" class="lite-btn primary">쇼룸 관리</a>
        <a href="../catalog/index.json" class="lite-btn">카탈로그 JSON</a>
        <a href="../index.html" class="lite-btn">메인 페이지</a>
      </div>
    </div>
  </div>
</body>
</html>
