<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0c" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PAPAFLY</title>
  <style>
    :root {
      --bg: #0a0f0c;
      --card: #141f18;
      --gold: #f0c850;
      --gold-dim: rgba(240,200,80,.15);
      --text: #ffffff;
      --muted: rgba(255,255,255,.5);
      --border: rgba(255,255,255,.1);
      --r: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 400px;
    }

    /* Header */
    .head {
      text-align: center;
      margin-bottom: 36px;
    }

    .head-logo {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .head-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .head-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* Buttons */
    .tools {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      text-decoration: none;
      transition: all .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tool-btn:active {
      transform: scale(.97);
      border-color: var(--gold);
      background: var(--gold-dim);
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      background: var(--gold-dim);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .tool-info {
      flex: 1;
      text-align: left;
    }

    .tool-name {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .tool-desc {
      font-size: 12px;
      color: var(--muted);
    }

    .tool-arrow {
      font-size: 18px;
      color: var(--muted);
    }

    /* Footer */
    .foot {
      text-align: center;
      margin-top: 40px;
      font-size: 11px;
      color: var(--muted);
    }

    .foot a {
      color: var(--gold);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="app">

  <div class="head">
    <div class="head-logo">🍩</div>
    <div class="head-title">PAPAFLY</div>
    <div class="head-sub">내 도구</div>
  </div>

  <div class="tools">

    <a href="https://dtslib1979.github.io/dtslib-cloud-appstore/msmr-cut/" target="_blank" class="tool-btn">
      <div class="tool-icon">✂️</div>
      <div class="tool-info">
        <div class="tool-name">영상 자르기</div>
        <div class="tool-desc">MSMR Cut — 구간 잘라서 저장</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

    <a href="https://dtslib1979.github.io/dtslib-cloud-appstore/clip-shorts/" target="_blank" class="tool-btn">
      <div class="tool-icon">🎬</div>
      <div class="tool-info">
        <div class="tool-name">클립 만들기</div>
        <div class="tool-desc">Clip Shorts — 쇼츠/릴스용 클립</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

    <a href="https://dtslib1979.github.io/dtslib-cloud-appstore/image-pack/" target="_blank" class="tool-btn">
      <div class="tool-icon">🖼️</div>
      <div class="tool-info">
        <div class="tool-name">썸네일 만들기</div>
        <div class="tool-desc">Image Pack — 사진 묶어서 편집</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

    <a href="../tools/publisher.html" class="tool-btn">
      <div class="tool-icon">📝</div>
      <div class="tool-info">
        <div class="tool-name">글 올리기</div>
        <div class="tool-desc">ChatGPT로 글 쓰고 바로 게시</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>

  </div>

  <div class="foot">
    PAPAFLY · <a href="https://papafly.kr">papafly.kr</a>
  </div>

</div>

</body>
</html>
