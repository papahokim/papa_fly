<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>PAPAFLY 쇼룸 — 80s 일본제 나이론 파카</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; background: #0d0b08; font-family: 'Pretendard', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .phone-frame { width: 390px; height: 844px; border: 2px solid #3a3025; border-radius: 44px; background: #1a1510; padding: 20px; position: relative; box-shadow: 0 0 60px rgba(196,163,90,0.1); }
    .phone-notch { width: 160px; height: 28px; background: #0d0b08; border-radius: 0 0 16px 16px; margin: -20px auto 12px; }
    .phone-header { text-align: center; padding-bottom: 16px; border-bottom: 1px solid #3a3025; margin-bottom: 16px; }
    .phone-title { font-family: 'Noto Serif JP', serif; font-size: 13px; color: #c4a35a; letter-spacing: 3px; }
    .phone-sub { font-size: 9px; color: #6b5e4f; letter-spacing: 1px; margin-top: 4px; }
    .phone-content { display: flex; flex-direction: column; gap: 8px; }
    .phone-card { background: #241e17; border-radius: 8px; padding: 12px; }
    .phone-card-title { font-size: 11px; color: #c4a35a; margin-bottom: 4px; }
    .phone-card-text { font-size: 10px; color: #a89880; }
    .phone-card-price { font-size: 10px; color: #f0ebe3; text-align: right; margin-top: 4px; }
    .label { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #6b5e4f; letter-spacing: 3px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="phone-header">
      <div class="phone-title">PAPAFLY  쇼룸</div>
      <div class="phone-sub">재패니즈 패치 — 일본의 시간을 입다</div>
    </div>
    <div class="phone-content">
      <div class="phone-card">
        <div class="phone-card-title">재패니즈 패치 #003</div>
        <div class="phone-card-text">80s 일본제 나이론 파카</div>
        <div class="phone-card-price">₩168,000</div>
      </div>
      <div class="phone-card">
        <div class="phone-card-title">物語</div>
        <div class="phone-card-text">도쿄 시부야 하라주쿠 중고 밀리터리숍 · 1980s</div>
      </div>
      <div class="phone-card">
        <div class="phone-card-title">鑑定</div>
        <div class="phone-card-text">鑑定 B — 양품</div>
      </div>
    </div>
  </div>
  <span class="label">PAPAFLY SHOWROOM · papafly.kr</span>
</body>
</html>
