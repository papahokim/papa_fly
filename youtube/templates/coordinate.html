<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>コーデ — {{name.ko}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; background: #0d0b08; font-family: 'Pretendard', sans-serif; overflow: hidden; position: relative; }
    body::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(196,163,90,0.08) 0%, transparent 50%); }
    .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 48px; background: linear-gradient(transparent, rgba(13,11,8,0.95)); }
    .label { font-family: 'Noto Serif JP', serif; font-size: 13px; color: #c4a35a; letter-spacing: 6px; margin-bottom: 8px; }
    .name { font-family: 'Noto Serif JP', serif; font-size: 32px; color: #f0ebe3; margin-bottom: 4px; }
    .price { font-size: 18px; color: #c4a35a; font-weight: 600; }
    .badge { position: absolute; top: 32px; right: 40px; font-size: 11px; color: #c4a35a; letter-spacing: 3px; border: 1px solid #c4a35a; padding: 6px 16px; }
    .placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #3a3025; font-size: 12px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <span class="placeholder">〔 이미지 영역 〕</span>
  <div class="overlay">
    <p class="label">コーデ 提案</p>
    <h1 class="name">{{name.ko}}</h1>
    <p class="price">₩{{_priceComma}}</p>
  </div>
  <span class="badge">PAPAFLY</span>
</body>
</html>
