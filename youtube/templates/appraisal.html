<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>鑑定 {{condition.grade}} — {{name.ko}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1280px; height: 720px; background: #1a1510; font-family: 'Pretendard', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
    body::before { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="none"/><rect x="0" y="0" width="100" height="100" fill="rgba(196,163,90,0.03)"/></svg>'); opacity: 0.5; }
    .kanji { font-family: 'Noto Serif JP', serif; font-size: 96px; font-weight: 900; color: #c4a35a; letter-spacing: 16px; margin-bottom: 24px; text-shadow: 0 0 40px rgba(196,163,90,0.3); }
    .grade-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; }
    .grade-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3a3025; }
    .grade-dot.active { background: #c4a35a; border-color: #c4a35a; box-shadow: 0 0 12px rgba(196,163,90,0.5); }
    .grade-label { font-size: 14px; color: #c4a35a; letter-spacing: 3px; margin-bottom: 8px; }
    .item-name { font-size: 22px; color: #f0ebe3; margin-bottom: 4px; }
    .item-era { font-size: 13px; color: #6b5e4f; }
    .logo { position: absolute; top: 32px; right: 40px; font-family: 'Noto Serif JP', serif; font-size: 14px; color: #c4a35a; letter-spacing: 4px; }
  </style>
</head>
<body>
  <span class="logo">PAPAFLY</span>
  <h1 class="kanji">鑑定</h1>
  <p class="grade-label">{{_gradeFull}}</p>
  <div class="grade-row">
    <span class="grade-dot {{#grade_A}}active{{/grade_A}}"></span>
    <span class="grade-dot {{#grade_B}}active{{/grade_B}}"></span>
    <span class="grade-dot {{#grade_C}}active{{/grade_C}}"></span>
    <span class="grade-dot {{#grade_D}}active{{/grade_D}}"></span>
    <span class="grade-dot"></span>
  </div>
  <p class="item-name">{{name.ko}}</p>
  <p class="item-era">{{era}} · {{made_in}}</p>
</body>
</html>
