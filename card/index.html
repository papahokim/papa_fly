<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b08">
  <title>명함 — Business Card | PAPAFLY</title>
  <meta name="description" content="PAPAFLY - Real Money, Real World | EST. 2026.01.13">
  <meta property="og:title" content="PAPAFLY">
  <meta property="og:description" content="Real Money, Real World | EST. 2026.01.13">
  <meta property="og:image" content="https://dtslib1979.github.io/papafly/assets/Face.jpg">
  <meta property="og:locale" content="ko_KR">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    .cd-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-lg); background: var(--bg); }
    .card-wrap { width: 100%; max-width: 380px; }
    .business-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: var(--space-xl); position: relative; overflow: hidden; transition: all 0.4s ease; }
    .business-card:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(212,175,55,0.05); border-color: var(--gold); }
    .business-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .bc-brand { font-family: var(--font-heading); font-size: 1.5rem; color: var(--text); letter-spacing: 0.1em; }
    .bc-tagline { font-size: 0.7rem; color: var(--gold); letter-spacing: 0.2em; margin: var(--space-xs) 0 var(--space-lg); }
    .bc-line { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    .bc-label { color: var(--text-dim); }
    .bc-value { color: var(--text); }
    .bc-footer { margin-top: var(--space-lg); padding-top: var(--space-lg); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .bc-est { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.15em; }
    .bc-logo { font-family: var(--font-heading); font-size: 0.8rem; color: var(--gold); }
    .bc-badge { display: inline-block; padding: 4px 12px; border: 1px solid var(--gold); border-radius: 999px; font-size: 0.6rem; letter-spacing: 0.15em; color: var(--gold); margin-top: var(--space-md); }
    .bc-links { display: flex; gap: var(--space-sm); margin-top: var(--space-md); }
    .bc-links a { font-size: 0.7rem; color: var(--text-dim); text-decoration: none; padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; transition: all 0.2s; }
    .bc-links a:hover { border-color: var(--gold); color: var(--gold); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
</head>
<body class="cd-body">
  <div class="card-wrap">
    <div class="business-card" data-tilt data-tilt-glare data-tilt-max-glare="0.15" data-tilt-max="8">
      <div class="bc-brand">PAPAFLY</div>
      <div class="bc-tagline">REAL MONEY, REAL WORLD</div>
      <div class="bc-line"><span class="bc-label">역할</span><span class="bc-value">Master Curator</span></div>
      <div class="bc-line"><span class="bc-label">소속</span><span class="bc-value">dtslib Branch</span></div>
      <div class="bc-line"><span class="bc-label">도메인</span><span class="bc-value">papafly.kr</span></div>
      <div class="bc-line"><span class="bc-label">컨셉</span><span class="bc-value">재패니즈 패치</span></div>
      <div class="bc-line"><span class="bc-label">스페셜티</span><span class="bc-value">일본 빈티지 큐레이션</span></div>
      <div class="bc-footer">
        <span class="bc-est">EST. 2026.01.13</span>
        <span class="bc-logo">🦋</span>
      </div>
      <div style="text-align:center">
        <span class="bc-badge">BUILT ON GOLD · MEASURED IN SILVER</span>
      </div>
      <div class="bc-links" style="justify-content:center">
        <a href="../index.html">🏠 홈</a>
        <a href="../showroom/index.html">🛍️ 쇼룸</a>
        <a href="https://github.com/dtslib1979/papafly" target="_blank">📂 GitHub</a>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
  <script>
    if (typeof VanillaTilt !== 'undefined') {
      VanillaTilt.init(document.querySelector('[data-tilt]'), {
        max: 8, speed: 300, glare: true, 'max-glare': 0.15
      });
    }
    if (typeof gsap !== 'undefined') {
      gsap.from('.business-card', { opacity: 0, y: 30, duration: 0.8, ease: 'power3.out' });
    }
  </script>
</body>
</html>
