<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="methodsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58D68D"/>
      <stop offset="50%" style="stop-color:#27AE60"/>
      <stop offset="100%" style="stop-color:#1E8449"/>
    </linearGradient>
    <filter id="methodsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4A6"/>
      <stop offset="50%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <linearGradient id="trendLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFAF5;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#F1C40F"/>
    </linearGradient>
  </defs>
  <!-- Main circle -->
  <circle cx="50" cy="50" r="47" fill="url(#methodsGrad)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Chart bars with gold gradient -->
  <g filter="url(#methodsGlow)">
    <rect x="20" y="58" width="14" height="22" rx="3" fill="url(#goldBar)"/>
    <rect x="20" y="58" width="14" height="4" rx="2" fill="#FFFAF5" opacity="0.3"/>

    <rect x="38" y="45" width="14" height="35" rx="3" fill="url(#goldBar)"/>
    <rect x="38" y="45" width="14" height="4" rx="2" fill="#FFFAF5" opacity="0.3"/>

    <rect x="56" y="32" width="14" height="48" rx="3" fill="url(#goldBar)"/>
    <rect x="56" y="32" width="14" height="4" rx="2" fill="#FFFAF5" opacity="0.3"/>
  </g>

  <!-- Trend arrow with glow -->
  <path d="M27 50 L45 38 L63 26" stroke="url(#trendLine)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="63" cy="26" r="5" fill="#F1C40F"/>
  <circle cx="63" cy="26" r="3" fill="#FFFAF5"/>

  <!-- Arrow pointing up -->
  <polygon points="75,22 80,32 77,32 77,42 73,42 73,32 70,32" fill="#FFFAF5" opacity="0.9"/>

  <!-- Won symbol with style -->
  <g transform="translate(78, 50)">
    <circle cx="0" cy="0" r="12" fill="#1A1A1A" opacity="0.3"/>
    <text x="0" y="6" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFAF5" text-anchor="middle">₩</text>
  </g>

  <!-- Sparkle accents -->
  <circle cx="82" cy="65" r="2" fill="#FFFAF5" opacity="0.7"/>
  <circle cx="15" cy="35" r="1.5" fill="#FFFAF5" opacity="0.5"/>

  <!-- Coin stack hint -->
  <ellipse cx="85" cy="75" rx="6" ry="2" fill="#D4A853" opacity="0.6"/>
  <ellipse cx="85" cy="73" rx="6" ry="2" fill="#D4A853" opacity="0.7"/>
  <ellipse cx="85" cy="71" rx="6" ry="2" fill="#F4E4A6" opacity="0.8"/>
</svg>
