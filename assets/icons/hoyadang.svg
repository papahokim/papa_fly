<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hoyadangGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42"/>
      <stop offset="50%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#E85A24"/>
    </linearGradient>
    <filter id="hoyadangGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="50%" style="stop-color:#F4E4A6"/>
      <stop offset="100%" style="stop-color:#D4A853"/>
    </linearGradient>
  </defs>
  <!-- Main circle with gradient -->
  <circle cx="50" cy="50" r="47" fill="url(#hoyadangGrad)" filter="url(#hoyadangGlow)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldShine)" stroke-width="1.5" opacity="0.6"/>
  <!-- Korean traditional donut/bread shape -->
  <ellipse cx="50" cy="52" rx="22" ry="18" fill="#FFFAF5" opacity="0.95"/>
  <ellipse cx="50" cy="52" rx="8" ry="6" fill="url(#hoyadangGrad)"/>
  <!-- Steam lines -->
  <path d="M38 32 Q36 28 38 24" stroke="#FFFAF5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M50 30 Q48 25 50 20" stroke="#FFFAF5" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M62 32 Q64 28 62 24" stroke="#FFFAF5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Subtle sparkle -->
  <circle cx="32" cy="40" r="1.5" fill="#FFFAF5" opacity="0.8"/>
  <circle cx="68" cy="38" r="1" fill="#FFFAF5" opacity="0.6"/>
  <!-- 好 character hint - simplified artistic stroke -->
  <text x="50" y="80" font-family="serif" font-size="12" font-weight="600" fill="#FFFAF5" text-anchor="middle" opacity="0.9">好爺堂</text>
</svg>
