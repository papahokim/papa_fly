<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fbtdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DADE2"/>
      <stop offset="50%" style="stop-color:#3498DB"/>
      <stop offset="100%" style="stop-color:#2874A6"/>
    </linearGradient>
    <filter id="fbtdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="growthPath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFAF5;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FFFAF5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F1C40F;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Main circle -->
  <circle cx="50" cy="50" r="47" fill="url(#fbtdGrad)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Growth timeline path -->
  <path d="M18 65 Q35 60 50 50 Q65 40 82 30" stroke="url(#growthPath)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Baby icon (left, small) -->
  <g filter="url(#fbtdGlow)">
    <circle cx="22" cy="62" r="7" fill="#FFFAF5"/>
    <ellipse cx="22" cy="72" rx="5" ry="6" fill="#FFFAF5"/>
    <!-- Baby face -->
    <circle cx="20" cy="61" r="1" fill="#3498DB"/>
    <circle cx="24" cy="61" r="1" fill="#3498DB"/>
    <path d="M20 64 Q22 66 24 64" stroke="#3498DB" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Child icon (middle-left) -->
  <g filter="url(#fbtdGlow)" opacity="0.9">
    <circle cx="38" cy="54" r="6" fill="#FFFAF5"/>
    <rect x="33" y="62" width="10" height="12" rx="2" fill="#FFFAF5"/>
  </g>

  <!-- Student icon (middle-right) -->
  <g filter="url(#fbtdGlow)" opacity="0.95">
    <circle cx="58" cy="44" r="7" fill="#FFFAF5"/>
    <rect x="52" y="53" width="12" height="14" rx="2" fill="#FFFAF5"/>
    <!-- Graduation cap -->
    <rect x="52" y="37" width="12" height="2" fill="#1A1A1A"/>
    <polygon points="58,33 52,37 64,37" fill="#1A1A1A"/>
    <circle cx="58" cy="37" r="1" fill="#F1C40F"/>
  </g>

  <!-- Doctor icon (right, largest) -->
  <g filter="url(#fbtdGlow)">
    <circle cx="78" cy="32" r="9" fill="#FFFAF5"/>
    <rect x="70" y="43" width="16" height="18" rx="3" fill="#FFFAF5"/>
    <!-- Stethoscope -->
    <path d="M73 48 Q70 55 75 60" stroke="#3498DB" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="76" cy="61" r="3" fill="#3498DB"/>
    <circle cx="76" cy="61" r="1.5" fill="#1A1A1A"/>
    <!-- Medical cross -->
    <rect x="80" y="50" width="2" height="8" fill="#E74C3C"/>
    <rect x="77" y="53" width="8" height="2" fill="#E74C3C"/>
    <!-- Doctor face -->
    <circle cx="76" cy="31" r="1" fill="#3498DB"/>
    <circle cx="80" cy="31" r="1" fill="#3498DB"/>
    <path d="M76 35 Q78 37 80 35" stroke="#3498DB" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Star accent for achievement -->
  <polygon points="85,18 86.5,22 91,22 87.5,25 89,30 85,27 81,30 82.5,25 79,22 83.5,22" fill="#F1C40F" opacity="0.9"/>
</svg>
