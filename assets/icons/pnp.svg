<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pnpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="50%" style="stop-color:#E74C3C"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <filter id="pnpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2C5282"/>
    </linearGradient>
  </defs>
  <!-- Main circle -->
  <circle cx="50" cy="50" r="47" fill="url(#pnpGrad)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Camera body - premium design -->
  <rect x="20" y="32" width="32" height="26" rx="4" fill="#FFFAF5" filter="url(#pnpShadow)"/>
  <rect x="26" y="28" width="14" height="6" rx="2" fill="#FFFAF5"/>
  <!-- Lens with gradient -->
  <circle cx="36" cy="45" r="9" fill="url(#lensGrad)"/>
  <circle cx="36" cy="45" r="6" fill="#1A1A1A"/>
  <circle cx="36" cy="45" r="3" fill="url(#lensGrad)" opacity="0.6"/>
  <circle cx="33" cy="42" r="1.5" fill="#FFFAF5" opacity="0.8"/>
  <!-- Flash -->
  <rect x="44" y="34" width="5" height="3" rx="1" fill="#F1C40F"/>

  <!-- Paint palette - artistic -->
  <ellipse cx="68" cy="58" rx="18" ry="14" fill="#FFFAF5" filter="url(#pnpShadow)"/>
  <ellipse cx="68" cy="58" rx="16" ry="12" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <!-- Paint dots with depth -->
  <circle cx="60" cy="52" r="4" fill="#3498DB"/>
  <circle cx="60" cy="52" r="2" fill="#5DADE2" opacity="0.6"/>
  <circle cx="70" cy="50" r="4" fill="#F1C40F"/>
  <circle cx="70" cy="50" r="2" fill="#F9E79F" opacity="0.6"/>
  <circle cx="78" cy="54" r="4" fill="#E74C3C"/>
  <circle cx="78" cy="54" r="2" fill="#F1948A" opacity="0.6"/>
  <circle cx="76" cy="64" r="4" fill="#9B59B6"/>
  <circle cx="76" cy="64" r="2" fill="#D2B4DE" opacity="0.6"/>
  <circle cx="64" cy="66" r="4" fill="#2ECC71"/>
  <circle cx="64" cy="66" r="2" fill="#ABEBC6" opacity="0.6"/>
  <!-- Thumb hole -->
  <ellipse cx="58" cy="60" rx="3" ry="4" fill="url(#pnpGrad)"/>

  <!-- Brush stroke accent -->
  <path d="M55 75 Q60 72 65 75" stroke="#FFFAF5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
</svg>
