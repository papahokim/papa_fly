<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="folioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A"/>
      <stop offset="100%" style="stop-color:#2D2D2D"/>
    </linearGradient>
    <linearGradient id="pageGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4A6"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8962E"/>
    </linearGradient>
    <filter id="folioGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main circle - dark elegant -->
  <circle cx="50" cy="50" r="47" fill="url(#folioGrad)"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#pageGold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Open book/folio - elegant spread -->
  <g filter="url(#folioGlow)" transform="translate(50,50)">
    <!-- Left page -->
    <path d="M-5 -18 L-5 22 Q-18 20 -28 18 L-28 -16 Q-18 -18 -5 -18" fill="#FFFAF5"/>
    <path d="M-5 -18 L-5 22 Q-18 20 -28 18 L-28 -16 Q-18 -18 -5 -18" fill="none" stroke="url(#pageGold)" stroke-width="1"/>
    <!-- Left page lines -->
    <line x1="-24" y1="-8" x2="-9" y2="-8" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <line x1="-24" y1="-2" x2="-9" y2="-2" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <line x1="-24" y1="4" x2="-9" y2="4" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <line x1="-24" y1="10" x2="-16" y2="10" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>

    <!-- Right page -->
    <path d="M5 -18 L5 22 Q18 20 28 18 L28 -16 Q18 -18 5 -18" fill="#FFFAF5"/>
    <path d="M5 -18 L5 22 Q18 20 28 18 L28 -16 Q18 -18 5 -18" fill="none" stroke="url(#pageGold)" stroke-width="1"/>
    <!-- Right page - image placeholder -->
    <rect x="9" y="-12" width="15" height="12" rx="1" fill="url(#pageGold)" opacity="0.3"/>
    <rect x="9" y="-12" width="15" height="12" rx="1" fill="none" stroke="url(#pageGold)" stroke-width="0.5"/>
    <line x1="9" y1="6" x2="24" y2="6" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
    <line x1="9" y1="12" x2="20" y2="12" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>

    <!-- Center spine -->
    <line x1="0" y1="-20" x2="0" y2="24" stroke="url(#pageGold)" stroke-width="2"/>
  </g>

  <!-- folio text -->
  <text x="50" y="82" font-family="Georgia, serif" font-size="10" font-style="italic" fill="url(#pageGold)" text-anchor="middle" letter-spacing="2">folio</text>
</svg>
