<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="papaflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <filter id="papaflyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="pfGoldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#F4E4A6"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Main circle -->
  <circle cx="50" cy="50" r="47" fill="url(#papaflyGrad)" filter="url(#papaflyGlow)"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#pfGoldShine)" stroke-width="1.5" opacity="0.6"/>
  <!-- Camera lens shape (photographer) -->
  <circle cx="50" cy="46" r="18" fill="none" stroke="#FFFAF5" stroke-width="2.5" opacity="0.9"/>
  <circle cx="50" cy="46" r="11" fill="none" stroke="#FFFAF5" stroke-width="1.5" opacity="0.7"/>
  <circle cx="50" cy="46" r="5" fill="#FFFAF5" opacity="0.85"/>
  <!-- Sparkle -->
  <circle cx="56" cy="40" r="2" fill="#FFFAF5" opacity="0.9"/>
  <!-- Text -->
  <text x="50" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFAF5" text-anchor="middle" opacity="0.9">PAPAFLY</text>
</svg>
