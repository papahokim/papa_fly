<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b87a"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>
  </defs>
  <!-- Background — 墨 sumi warm black -->
  <rect width="100" height="100" rx="13" fill="#0d0b08"/>
  <!-- Thin gold frame — premium border -->
  <rect x="6" y="6" width="88" height="88" rx="9" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.6"/>
  <!-- PF monogram -->
  <text x="50" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="-1">PF</text>
  <!-- Thin separator line — 일본 미니멀리즘 -->
  <line x1="26" y1="70" x2="74" y2="70" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
</svg>
