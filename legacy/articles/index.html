<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f0c">
  <title>글 목록 | PAPAFLY</title>
  <style>
    :root {
      --bg: #0a0f0c;
      --card: #141f18;
      --gold: #f0c850;
      --gold-dim: rgba(240,200,80,.15);
      --text: #ffffff;
      --muted: rgba(255,255,255,.5);
      --border: rgba(255,255,255,.1);
      --r: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .app { max-width: 540px; margin: 0 auto; }

    /* Header */
    .head {
      text-align: center;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .head-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .head-count { font-size: 13px; color: var(--muted); }
    .head-back {
      display: inline-block; margin-top: 12px; font-size: 13px;
      color: var(--gold); text-decoration: none;
    }

    /* Article List */
    .list { display: flex; flex-direction: column; gap: 8px; }

    .item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--r);
      text-decoration: none; color: var(--text);
      transition: all .2s; -webkit-tap-highlight-color: transparent;
    }
    .item:active { border-color: var(--gold); background: var(--gold-dim); }

    .item-icon {
      width: 40px; height: 40px; background: var(--gold-dim);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
    }

    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 15px; font-weight: 600; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-date { font-size: 12px; color: var(--muted); }
    .item-arrow { font-size: 16px; color: var(--muted); }

    /* States */
    .loading, .empty {
      text-align: center; padding: 60px 16px; color: var(--muted);
    }
    .loading-dot { font-size: 24px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* Footer */
    .foot {
      text-align: center; margin-top: 40px; padding-top: 20px;
      border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
    }
    .foot a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>

<div class="app">
  <div class="head">
    <div class="head-title">글 목록</div>
    <div class="head-count" id="countText">불러오는 중...</div>
    <a href="../" class="head-back">← 홈으로</a>
  </div>

  <div id="content">
    <div class="loading">
      <div class="loading-dot">...</div>
      <p>글 목록 불러오는 중</p>
    </div>
  </div>

  <div class="foot">
    <a href="../">PAPAFLY</a> · <a href="../tools/publisher.html">글 올리기</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  var OWNER = 'dtslib1979';
  var REPO = 'papafly';
  var PATH = 'articles';

  function parseDateFromName(name) {
    var m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '.' + m[2] + '.' + m[3];
    return '';
  }

  function makeTitle(name) {
    var clean = name.replace(/\.html$/, '');
    var m = clean.match(/^\d{4}-\d{2}-\d{2}-?\d*\s*(.*)$/);
    if (m && m[1]) return m[1];
    return clean.replace(/-/g, ' ').replace(/^\w/, function(c) { return c.toUpperCase(); });
  }

  async function load() {
    var container = document.getElementById('content');
    var countText = document.getElementById('countText');

    try {
      var res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH);
      if (!res.ok) throw new Error(res.status);

      var files = await res.json();
      var articles = files
        .filter(function(f) {
          return f.name.endsWith('.html') && f.name !== 'index.html';
        })
        .sort(function(a, b) { return b.name.localeCompare(a.name); });

      countText.textContent = articles.length + '개 글';

      if (articles.length === 0) {
        container.innerHTML =
          '<div class="empty">' +
          '<div class="empty-icon">📝</div>' +
          '<p>아직 올린 글이 없습니다</p>' +
          '</div>';
        return;
      }

      var html = '<div class="list">';
      articles.forEach(function(f) {
        var date = parseDateFromName(f.name);
        var title = makeTitle(f.name);
        var url = f.name;
        html += '<a href="' + url + '" class="item">' +
          '<div class="item-icon">📄</div>' +
          '<div class="item-info">' +
          '<div class="item-title">' + title + '</div>' +
          '<div class="item-date">' + date + '</div>' +
          '</div>' +
          '<span class="item-arrow">›</span>' +
          '</a>';
      });
      html += '</div>';
      container.innerHTML = html;

    } catch (e) {
      container.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">⚠️</div>' +
        '<p>목록을 불러올 수 없습니다</p>' +
        '</div>';
      countText.textContent = '';
    }
  }

  load();
})();
</script>

</body>
</html>
