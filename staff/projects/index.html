<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Projects | Staff Portal</title>
  <link rel="icon" href="../../assets/icons/phoneparis.logo.jpg">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <style>
    :root {
      --bg: #1A1A1A;
      --bg-elevated: #2A2A2A;
      --bg-card: #333333;
      --wood: #C4A77D;
      --gold: #D4AF37;
      --gold-dim: rgba(212,175,55,.15);
      --red: #E85D5D;
      --text: #F5F5F0;
      --text-secondary: rgba(245,245,240,.7);
      --text-muted: rgba(245,245,240,.5);
      --border: rgba(212,175,55,.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { color: var(--gold); }
    h1 { font-size: 24px; font-weight: 600; }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .project-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .project-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
    }
    .project-card.public {
      border-color: var(--wood);
    }
    .project-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .status-concept { background: var(--gold-dim); color: var(--gold); }
    .status-planning { background: rgba(59,130,246,.2); color: #60A5FA; }
    .status-active { background: rgba(196,167,125,.2); color: #4ADE80; }
    .status-completed { background: rgba(156,163,175,.2); color: #9CA3AF; }
    .project-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .project-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .project-workflow {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }
    .workflow-step {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
    }
    .workflow-step.done { background: var(--wood); }
    .workflow-step.active { background: var(--gold); }
    .project-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .project-link {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: all 0.2s;
    }
    .project-link:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .public-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(196,167,125,.2);
      color: #4ADE80;
      margin-left: 8px;
    }
    .detail-panel {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
      display: none;
    }
    .detail-panel.visible { display: block; }
    .section { margin-bottom: 24px; }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .candidate-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .candidate-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .candidate-name { font-weight: 600; margin-bottom: 4px; }
    .candidate-desc { font-size: 12px; color: var(--text-muted); }
    .meeting-list-compact {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meeting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg);
      border-radius: 6px;
    }
    .meeting-item-date { font-size: 12px; color: var(--gold); }
    .meeting-item-title { font-size: 14px; }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }
    .btn {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--bg-card);
      border-color: var(--gold);
    }
    .btn-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--bg);
    }
    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../" class="back-link">← Staff Portal</a>
      <h1>Projects</h1>
    </header>

    <div id="projectGrid" class="project-grid">
      <div class="empty-state">로딩 중...</div>
    </div>

    <div id="detailPanel" class="detail-panel"></div>
  </div>

  <script>
    const STORAGE_KEY = 'phoneparis_staff_auth';
    const REGISTRY_PATH = '../../data/registry.json';

    let projects = [];
    let selectedProject = null;

    async function init() {
      if (sessionStorage.getItem(STORAGE_KEY) !== 'true') {
        location.href = '../';
        return;
      }

      try {
        const res = await fetch(REGISTRY_PATH);
        const registry = await res.json();
        projects = registry.projects || [];
        renderProjectGrid();
      } catch (e) {
        console.error('Failed to load registry:', e);
        document.getElementById('projectGrid').innerHTML =
          '<div class="empty-state">데이터를 불러올 수 없습니다.</div>';
      }
    }

    function renderProjectGrid() {
      const container = document.getElementById('projectGrid');

      if (projects.length === 0) {
        container.innerHTML = '<div class="empty-state">등록된 프로젝트가 없습니다.</div>';
        return;
      }

      container.innerHTML = projects.map(p => `
        <div class="project-card ${p.public ? 'public' : ''}" onclick="selectProject('${p.id}')">
          <span class="project-status status-${p.status}">${p.status}</span>
          <div class="project-name">
            ${p.name}
            ${p.public ? '<span class="public-badge">PUBLIC</span>' : ''}
          </div>
          <div class="project-subtitle">${p.path}</div>
          <div class="project-links">
            <a href="../tools/decision-engine.html" class="project-link" onclick="event.stopPropagation()">Decision Engine</a>
            ${p.public ? `<a href="${p.publicPath}" class="project-link" onclick="event.stopPropagation()">공개 페이지</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function selectProject(id) {
      const project = projects.find(p => p.id === id);
      if (!project) return;

      try {
        // Load project meta
        const metaRes = await fetch(`../../data/${project.path}meta.json`);
        const meta = await metaRes.json();

        // Load candidates
        let candidates = [];
        try {
          const candFiles = ['gangnam', 'seongsu', 'hannam'];
          for (const c of candFiles) {
            const res = await fetch(`../../data/${project.path}candidates/${c}.json`);
            if (res.ok) candidates.push(await res.json());
          }
        } catch (e) {}

        selectedProject = { ...project, meta, candidates };
        renderDetailPanel();
      } catch (e) {
        console.error('Failed to load project:', e);
      }
    }

    function renderDetailPanel() {
      const container = document.getElementById('detailPanel');
      container.classList.add('visible');

      const p = selectedProject;
      const m = p.meta;
      const workflow = m.workflow || {};
      const workflowSteps = ['concept', 'locationSearch', 'decision', 'contract', 'design', 'construction', 'launch'];

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;">
          <div>
            <h2 style="font-size:24px;margin-bottom:4px;">${m.name}</h2>
            <p style="color:var(--text-muted);font-size:14px;">${m.subtitle || ''}</p>
          </div>
          <span class="project-status status-${m.status}">${m.status}</span>
        </div>

        <div class="section">
          <div class="section-title">워크플로우</div>
          <div class="project-workflow" style="height:8px;">
            ${workflowSteps.map(step => {
              const status = workflow[step];
              let cls = '';
              if (status === 'done') cls = 'done';
              else if (status === 'in_progress') cls = 'active';
              return `<div class="workflow-step ${cls}" title="${step}"></div>`;
            }).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:8px;">
            <span>콘셉트</span>
            <span>런칭</span>
          </div>
        </div>

        ${p.candidates.length ? `
        <div class="section">
          <div class="section-title">후보 입지 (${p.candidates.length})</div>
          <div class="candidate-list">
            ${p.candidates.map(c => `
              <div class="candidate-item">
                <div class="candidate-name">${c.name}</div>
                <div class="candidate-desc">${c.description || ''}</div>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        <div class="section">
          <div class="section-title">연결된 미팅</div>
          <div class="meeting-list-compact">
            ${(m.meetings || []).map(mid => `
              <a href="../meetings/#${mid}" class="meeting-item" style="text-decoration:none;color:inherit;">
                <span class="meeting-item-title">${mid}</span>
                <span style="color:var(--text-muted);">→</span>
              </a>
            `).join('')}
          </div>
        </div>

        <div class="btn-group">
          <a href="../tools/decision-engine.html" class="btn btn-primary">Decision Engine</a>
          <a href="../../projects/concepts/${p.id}/concept.md" class="btn" target="_blank">콘셉트 문서</a>
          ${p.public ? `<a href="${p.publicPath}" class="btn">공개 페이지 보기</a>` : ''}
          <button class="btn" onclick="downloadProjectData()">JSON 다운로드</button>
        </div>
      `;
    }

    function downloadProjectData() {
      if (!selectedProject) return;
      const blob = new Blob([JSON.stringify(selectedProject, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${selectedProject.id}-data.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    init();
  </script>
</body>
</html>
