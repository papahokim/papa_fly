<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Tracker | PAPA FLY Phase 0</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .tracker-header {
      text-align: center;
      padding: var(--spacing-lg) 0;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: var(--spacing-lg);
    }

    .tracker-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .tracker-period {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .verdict-box {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      padding: var(--spacing-lg);
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .verdict-box.pass {
      border-color: #81C784;
      background: rgba(129, 199, 132, 0.1);
    }

    .verdict-box.fail {
      border-color: #E57373;
      background: rgba(229, 115, 115, 0.1);
    }

    .verdict-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: var(--spacing-xs);
    }

    .verdict-status {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .verdict-box.pass .verdict-status {
      color: #81C784;
    }

    .verdict-box.fail .verdict-status {
      color: #E57373;
    }

    .verdict-note {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: var(--spacing-sm);
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
    }

    .kpi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
    }

    .kpi-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .kpi-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .kpi-status.met {
      background: rgba(129, 199, 132, 0.2);
      color: #81C784;
    }

    .kpi-status.unmet {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .kpi-values {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }

    .kpi-current {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--highlight);
    }

    .kpi-target {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .kpi-progress {
      height: 12px;
      background: var(--bg-card-hover);
      border-radius: 6px;
      overflow: hidden;
    }

    .kpi-progress-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s ease;
    }

    .kpi-progress-fill.low {
      background: #E57373;
    }

    .kpi-progress-fill.mid {
      background: #FFB74D;
    }

    .kpi-progress-fill.high {
      background: #81C784;
    }

    .kpi-input-group {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border-subtle);
    }

    .kpi-input {
      flex: 1;
      background: var(--bg-card-hover);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: var(--spacing-sm);
      font-size: 1rem;
      color: var(--text-primary);
      text-align: center;
    }

    .kpi-input:focus {
      outline: none;
      border-color: var(--highlight);
    }

    .update-btn {
      padding: var(--spacing-sm) var(--spacing-md);
    }

    .data-source {
      text-align: center;
      margin-top: var(--spacing-lg);
      padding: var(--spacing-md);
      background: var(--bg-card);
      border-radius: 12px;
    }

    .data-source-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
    }

    .data-source-links {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: center;
      flex-wrap: wrap;
    }

    .save-notice {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: var(--spacing-md);
    }

    @media (max-width: 480px) {
      .kpi-current {
        font-size: 2rem;
      }

      .kpi-input-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Back Link -->
    <a href="/staff/phase0/" class="btn btn-ghost" style="margin-bottom: var(--spacing-md);">← Phase 0 센터</a>

    <!-- Header -->
    <header class="tracker-header">
      <h1 class="tracker-title">KPI Tracker</h1>
      <p class="tracker-period">Phase 0 · 14일 관찰 기간</p>
    </header>

    <!-- Verdict Box -->
    <div class="verdict-box" id="verdict-box">
      <p class="verdict-label">Kill-Switch 판정 (2/3 필요)</p>
      <div class="verdict-status" id="verdict-status">0 / 3 충족</div>
      <p class="verdict-note" id="verdict-note">아직 데이터 수집 중</p>
    </div>

    <!-- KPI 1: Spanish Comments -->
    <div class="kpi-card" data-kpi="comments">
      <div class="kpi-header">
        <span class="kpi-name">💬 스페인어 댓글</span>
        <span class="kpi-status unmet" id="status-comments">미충족</span>
      </div>
      <div class="kpi-values">
        <span class="kpi-current" id="value-comments">0</span>
        <span class="kpi-target">/ 10개 이상</span>
      </div>
      <div class="kpi-progress">
        <div class="kpi-progress-fill low" id="progress-comments" style="width: 0%"></div>
      </div>
      <div class="kpi-input-group">
        <input type="number" class="kpi-input" id="input-comments" placeholder="현재 댓글 수" min="0">
        <button class="btn btn-secondary update-btn" onclick="updateKPI('comments')">업데이트</button>
      </div>
    </div>

    <!-- KPI 2: PWA Clicks -->
    <div class="kpi-card" data-kpi="clicks">
      <div class="kpi-header">
        <span class="kpi-name">🔗 PWA 클릭</span>
        <span class="kpi-status unmet" id="status-clicks">미충족</span>
      </div>
      <div class="kpi-values">
        <span class="kpi-current" id="value-clicks">0</span>
        <span class="kpi-target">/ 50회 이상</span>
      </div>
      <div class="kpi-progress">
        <div class="kpi-progress-fill low" id="progress-clicks" style="width: 0%"></div>
      </div>
      <div class="kpi-input-group">
        <input type="number" class="kpi-input" id="input-clicks" placeholder="현재 클릭 수" min="0">
        <button class="btn btn-secondary update-btn" onclick="updateKPI('clicks')">업데이트</button>
      </div>
    </div>

    <!-- KPI 3: View Duration -->
    <div class="kpi-card" data-kpi="duration">
      <div class="kpi-header">
        <span class="kpi-name">📺 평균 시청률</span>
        <span class="kpi-status unmet" id="status-duration">미충족</span>
      </div>
      <div class="kpi-values">
        <span class="kpi-current" id="value-duration">0</span>
        <span class="kpi-target">% / 35% 이상</span>
      </div>
      <div class="kpi-progress">
        <div class="kpi-progress-fill low" id="progress-duration" style="width: 0%"></div>
      </div>
      <div class="kpi-input-group">
        <input type="number" class="kpi-input" id="input-duration" placeholder="평균 시청률 (%)" min="0" max="100">
        <button class="btn btn-secondary update-btn" onclick="updateKPI('duration')">업데이트</button>
      </div>
    </div>

    <!-- Data Sources -->
    <div class="data-source">
      <p class="data-source-title">📊 데이터 소스</p>
      <div class="data-source-links">
        <a href="https://studio.youtube.com" target="_blank" class="btn btn-ghost btn-sm">YouTube Studio</a>
        <a href="https://plausible.io" target="_blank" class="btn btn-ghost btn-sm">Plausible</a>
      </div>
    </div>

    <p class="save-notice">✓ 데이터는 브라우저에 자동 저장됩니다</p>

    <!-- Footer -->
    <footer class="site-footer mt-lg">
      <a href="/staff/phase0/" class="btn btn-secondary">← Phase 0 센터로 돌아가기</a>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'papafly-phase0-kpi';
    const TARGETS = {
      comments: 10,
      clicks: 50,
      duration: 35
    };

    // Load saved data
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(key => {
          updateDisplay(key, data[key]);
        });
      }
      updateVerdict();
    }

    // Update KPI
    function updateKPI(kpi) {
      const input = document.getElementById(`input-${kpi}`);
      const value = parseInt(input.value, 10) || 0;

      // Save
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      saved[kpi] = value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

      // Update display
      updateDisplay(kpi, value);
      updateVerdict();

      // Clear input
      input.value = '';
    }

    // Update display for a KPI
    function updateDisplay(kpi, value) {
      const target = TARGETS[kpi];
      const percentage = Math.min((value / target) * 100, 100);
      const isMet = value >= target;

      // Value
      document.getElementById(`value-${kpi}`).textContent = value;

      // Progress bar
      const progressEl = document.getElementById(`progress-${kpi}`);
      progressEl.style.width = `${percentage}%`;
      progressEl.className = 'kpi-progress-fill';
      if (percentage >= 100) progressEl.classList.add('high');
      else if (percentage >= 50) progressEl.classList.add('mid');
      else progressEl.classList.add('low');

      // Status
      const statusEl = document.getElementById(`status-${kpi}`);
      statusEl.textContent = isMet ? '✓ 충족' : '미충족';
      statusEl.className = `kpi-status ${isMet ? 'met' : 'unmet'}`;
    }

    // Update verdict
    function updateVerdict() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      let metCount = 0;

      if ((saved.comments || 0) >= TARGETS.comments) metCount++;
      if ((saved.clicks || 0) >= TARGETS.clicks) metCount++;
      if ((saved.duration || 0) >= TARGETS.duration) metCount++;

      const verdictBox = document.getElementById('verdict-box');
      const verdictStatus = document.getElementById('verdict-status');
      const verdictNote = document.getElementById('verdict-note');

      verdictStatus.textContent = `${metCount} / 3 충족`;

      if (metCount >= 2) {
        verdictBox.className = 'verdict-box pass';
        verdictNote.textContent = '🎉 Phase 1 진행 가능!';
      } else if (metCount === 1) {
        verdictBox.className = 'verdict-box';
        verdictNote.textContent = '1개 더 충족 필요';
      } else {
        verdictBox.className = 'verdict-box';
        verdictNote.textContent = '아직 데이터 수집 중';
      }
    }

    // Initialize
    loadData();
  </script>
</body>
</html>
