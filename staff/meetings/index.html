<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Meeting Logs | Staff Portal</title>
  <link rel="icon" href="../../assets/icons/phoneparis.logo.jpg">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <style>
    /* Page-specific styles */
    .page-container { max-width: 900px; margin: 0 auto; padding: 24px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .back-link { color: var(--text-muted-light); text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--gold); }

    .meeting-list { display: flex; flex-direction: column; gap: 16px; }
    .meeting-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
    .meeting-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .meeting-card.active { border-color: var(--gold); background: var(--gold-dim); }
    .meeting-date { font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 4px; }
    .meeting-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .meeting-project { font-size: 13px; color: var(--text-muted-light); }

    .meeting-detail { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-top: 24px; display: none; }
    .meeting-detail.visible { display: block; }
    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .detail-title { font-size: 22px; font-weight: 600; }
    .detail-meta { font-size: 13px; color: var(--text-muted-light); }

    .meeting-section { margin-bottom: 24px; }
    .meeting-section-title { font-size: 14px; font-weight: 600; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .section-content { background: var(--bg); border-radius: 8px; padding: 16px; }
    .log-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .log-item:last-child { border-bottom: none; }
    .item-topic { font-weight: 600; margin-bottom: 4px; }
    .item-detail { font-size: 14px; color: var(--text-muted-light); }
    .item-rationale { font-size: 12px; color: var(--text-muted-light); margin-top: 4px; font-style: italic; }

    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .status-pending { background: var(--gold-dim); color: var(--gold); }
    .status-done { background: rgba(196,167,125,.2); color: #4ADE80; }

    .btn-group { display: flex; gap: 8px; margin-top: 24px; }
    .empty-state { text-align: center; padding: 48px; color: var(--text-muted-light); }
  </style>
</head>
<body>
  <div class="page-container">
    <header class="page-header">
      <a href="../" class="back-link">← Staff Portal</a>
      <h1>Meeting Logs</h1>
    </header>

    <div id="meetingList" class="meeting-list">
      <div class="empty-state">로딩 중...</div>
    </div>

    <div id="meetingDetail" class="meeting-detail"></div>
  </div>

  <script>
    const STORAGE_KEY = 'phoneparis_staff_auth';
    const REGISTRY_PATH = '../../data/registry.json';

    let meetings = [];
    let selectedMeeting = null;

    async function init() {
      // Auth check
      if (sessionStorage.getItem(STORAGE_KEY) !== 'true') {
        location.href = '../';
        return;
      }

      try {
        const res = await fetch(REGISTRY_PATH);
        const registry = await res.json();
        meetings = registry.meetings || [];
        renderMeetingList();
      } catch (e) {
        console.error('Failed to load registry:', e);
        document.getElementById('meetingList').innerHTML =
          '<div class="empty-state">데이터를 불러올 수 없습니다.</div>';
      }
    }

    function renderMeetingList() {
      const container = document.getElementById('meetingList');

      if (meetings.length === 0) {
        container.innerHTML = '<div class="empty-state">등록된 미팅이 없습니다.</div>';
        return;
      }

      container.innerHTML = meetings.map(m => `
        <div class="meeting-card" onclick="selectMeeting('${m.id}')">
          <div class="meeting-date">${m.date}</div>
          <div class="meeting-title">${m.title}</div>
          <div class="meeting-project">프로젝트: ${m.project || '-'}</div>
        </div>
      `).join('');
    }

    async function selectMeeting(id) {
      const meeting = meetings.find(m => m.id === id);
      if (!meeting) return;

      // Highlight selected
      document.querySelectorAll('.meeting-card').forEach(card => {
        card.classList.remove('active');
      });
      event.currentTarget.classList.add('active');

      // Load full meeting data
      try {
        const res = await fetch(`../../data/${meeting.path}`);
        const data = await res.json();
        selectedMeeting = data;
        renderMeetingDetail(data);
      } catch (e) {
        console.error('Failed to load meeting:', e);
      }
    }

    function renderMeetingDetail(m) {
      const container = document.getElementById('meetingDetail');
      container.classList.add('visible');

      container.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="detail-title">${m.title}</div>
            <div class="detail-meta">${m.date} · ${m.type || 'meeting'} · ${(m.attendees || []).join(', ')}</div>
          </div>
        </div>

        ${m.agenda && m.agenda.length ? `
        <div class="meeting-section">
          <div class="meeting-section-title">안건</div>
          <div class="section-content">
            ${m.agenda.map(a => `<div class="log-item"><div class="item-detail">• ${a}</div></div>`).join('')}
          </div>
        </div>
        ` : ''}

        ${m.decisions && m.decisions.length ? `
        <div class="meeting-section">
          <div class="meeting-section-title">결정사항</div>
          <div class="section-content">
            ${m.decisions.map(d => `
              <div class="log-item">
                <div class="item-topic">${d.topic}</div>
                <div class="item-detail">${d.decision}</div>
                ${d.rationale ? `<div class="item-rationale">"${d.rationale}"</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        ${m.actionItems && m.actionItems.length ? `
        <div class="meeting-section">
          <div class="meeting-section-title">액션 아이템</div>
          <div class="section-content">
            ${m.actionItems.map(a => `
              <div class="item" style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div class="item-topic">${a.task}</div>
                  <div class="item-detail">${a.assignee || '-'} ${a.dueDate ? `· ${a.dueDate}` : ''}</div>
                </div>
                <span class="status-badge status-${a.status}">${a.status}</span>
              </div>
            `).join('')}
          </div>
        </div>
        ` : ''}

        ${m.notes ? `
        <div class="meeting-section">
          <div class="meeting-section-title">메모</div>
          <div class="section-content">
            <div class="item-detail">${m.notes}</div>
          </div>
        </div>
        ` : ''}

        <div class="btn-group">
          <button class="btn" onclick="downloadMarkdown()">Markdown 다운로드</button>
          <button class="btn" onclick="copyToClipboard()">복사</button>
        </div>
      `;
    }

    function downloadMarkdown() {
      if (!selectedMeeting) return;
      const m = selectedMeeting;

      let md = `# ${m.title}\n\n`;
      md += `**일자:** ${m.date}  \n`;
      md += `**유형:** ${m.type || 'meeting'}  \n`;
      md += `**참석:** ${(m.attendees || []).join(', ')}  \n\n`;

      if (m.agenda && m.agenda.length) {
        md += `## 안건\n\n`;
        m.agenda.forEach(a => md += `- ${a}\n`);
        md += '\n';
      }

      if (m.decisions && m.decisions.length) {
        md += `## 결정사항\n\n`;
        m.decisions.forEach(d => {
          md += `### ${d.topic}\n`;
          md += `${d.decision}\n`;
          if (d.rationale) md += `> ${d.rationale}\n`;
          md += '\n';
        });
      }

      if (m.actionItems && m.actionItems.length) {
        md += `## 액션 아이템\n\n`;
        m.actionItems.forEach(a => {
          md += `- [ ] **${a.task}** (${a.assignee || '-'})\n`;
        });
        md += '\n';
      }

      if (m.notes) {
        md += `## 메모\n\n${m.notes}\n`;
      }

      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${m.id}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyToClipboard() {
      if (!selectedMeeting) return;
      navigator.clipboard.writeText(JSON.stringify(selectedMeeting, null, 2));
      alert('복사됨');
    }

    init();
  </script>
</body>
</html>
