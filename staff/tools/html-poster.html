<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포스팅 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #1A1410;
      --bg-card: #2D2420;
      --bg-input: #1a1a1a;
      --highlight: #E8A54B;
      --accent: #8B5A2B;
      --text-primary: #FFF8F0;
      --text-muted: #A89080;
      --success: #4ade80;
      --border: #3d3530;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--highlight);
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* Template Selection */
    .template-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .template-btn {
      padding: 12px 20px;
      background: var(--bg-card);
      border: 2px solid var(--border);
      color: var(--text-primary);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .template-btn:hover, .template-btn.active {
      border-color: var(--highlight);
      color: var(--highlight);
    }

    /* Preview Container - BIG */
    .preview-container {
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .preview-header {
      background: var(--bg-input);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .preview-title {
      font-weight: 600;
      color: var(--highlight);
    }

    .preview-wrapper {
      background: #fff;
      height: 60vh;
      min-height: 400px;
    }

    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Code Summary - Small */
    .code-summary {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-family: monospace;
      font-size: 0.85rem;
    }

    .code-line {
      color: var(--text-muted);
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .code-line .num {
      color: var(--accent);
      min-width: 30px;
    }

    .code-line .text {
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .code-dots {
      color: var(--text-muted);
      text-align: center;
      padding: 4px 0;
    }

    .code-toggle {
      color: var(--highlight);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 8px 0;
    }

    /* Hidden Editor */
    .editor-full {
      display: none;
      margin-top: 12px;
    }

    .editor-full.show {
      display: block;
    }

    #html-editor {
      width: 100%;
      height: 200px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filename-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    #filename {
      background: var(--bg-input);
      border: 2px solid var(--border);
      color: var(--text-primary);
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 1rem;
      width: 100%;
      max-width: 200px;
    }

    #filename:focus {
      outline: none;
      border-color: var(--highlight);
    }

    .filename-ext {
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--highlight);
      color: var(--bg-deep);
      flex: 1;
      min-width: 150px;
    }

    .btn-primary:hover {
      background: #f0b55c;
      transform: translateY(-2px);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: #000;
      padding: 16px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Simple Steps */
    .steps {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .steps-title {
      color: var(--highlight);
      font-weight: 700;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .step-num {
      background: var(--highlight);
      color: var(--bg-deep);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📝 포스팅</h1>
      <a href="../../" class="back-link">← 홈</a>
    </header>

    <!-- Template Selection -->
    <div class="template-bar">
      <button class="template-btn active" onclick="loadTemplate('recipe', this)">🍞 레시피</button>
      <button class="template-btn" onclick="loadTemplate('tip', this)">💡 꿀팁</button>
      <button class="template-btn" onclick="loadTemplate('blank', this)">📄 빈 페이지</button>
    </div>

    <!-- BIG Preview -->
    <div class="preview-container">
      <div class="preview-header">
        <span class="preview-title">👀 미리보기</span>
      </div>
      <div class="preview-wrapper">
        <iframe id="preview-frame"></iframe>
      </div>
    </div>

    <!-- Code Summary (minimal) -->
    <div class="code-summary">
      <div class="code-line">
        <span class="num">1</span>
        <span class="text" id="firstLine">&lt;!DOCTYPE html&gt;</span>
      </div>
      <div class="code-dots">···</div>
      <div class="code-line">
        <span class="num" id="lastLineNum">50</span>
        <span class="text" id="lastLine">&lt;/html&gt;</span>
      </div>
      <button class="code-toggle" onclick="toggleEditor()">코드 전체 보기 ▼</button>
      <div class="editor-full" id="editorFull">
        <textarea id="html-editor"></textarea>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="filename-group">
        <input type="text" id="filename" placeholder="파일명" />
        <span class="filename-ext">.html</span>
      </div>
      <button class="btn btn-primary" onclick="openGitHubUpload()">🚀 업로드</button>
    </div>

    <!-- Simple Steps -->
    <div class="steps">
      <div class="steps-title">📋 사용법</div>
      <div class="step-item">
        <span class="step-num">1</span>
        템플릿 선택
      </div>
      <div class="step-item">
        <span class="step-num">2</span>
        미리보기 확인
      </div>
      <div class="step-item">
        <span class="step-num">3</span>
        파일명 입력 → 업로드 → 끝!
      </div>
    </div>
  </div>

  <div class="toast" id="toast">복사 완료!</div>

  <script>
    const editor = document.getElementById('html-editor');
    const preview = document.getElementById('preview-frame');
    const filenameInput = document.getElementById('filename');
    const toast = document.getElementById('toast');
    const firstLineEl = document.getElementById('firstLine');
    const lastLineEl = document.getElementById('lastLine');
    const lastLineNumEl = document.getElementById('lastLineNum');
    const editorFull = document.getElementById('editorFull');

    let editorVisible = false;

    // Update preview and code summary
    function updatePreview() {
      const html = editor.value;
      const previewDoc = preview.contentDocument || preview.contentWindow.document;
      previewDoc.open();
      previewDoc.write(html);
      previewDoc.close();

      // Update code summary
      const lines = html.split('\n');
      firstLineEl.textContent = lines[0] || '';
      lastLineEl.textContent = lines[lines.length - 1] || '';
      lastLineNumEl.textContent = lines.length;
    }

    editor.addEventListener('input', updatePreview);

    function toggleEditor() {
      editorVisible = !editorVisible;
      editorFull.classList.toggle('show', editorVisible);
      document.querySelector('.code-toggle').textContent =
        editorVisible ? '코드 접기 ▲' : '코드 전체 보기 ▼';
    }

    // Templates
    const templates = {
      recipe: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레시피 제목 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .badge {
      display: inline-block;
      background: #E8A54B;
      color: #1A1410;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #E8A54B; }
    .meta { color: #A89080; margin-bottom: 30px; }
    .highlight-box {
      background: rgba(232, 165, 75, 0.15);
      border: 2px solid #E8A54B;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin: 30px 0;
    }
    .temp { font-size: 2.5rem; font-weight: 700; color: #E8A54B; }
    .time { font-size: 1.2rem; color: #A89080; margin-top: 8px; }
    .step {
      background: #2D2420;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }
    .step-num {
      background: #E8A54B;
      color: #1A1410;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 12px;
    }
    .tip {
      background: rgba(139, 90, 43, 0.3);
      border-left: 4px solid #8B5A2B;
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin: 30px 0;
    }
    .tip-title { color: #E8A54B; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">에어프라이어</span>
    <h1>🥐 크루아상 리히팅</h1>
    <p class="meta">PAPA FLY 시그니처 레시피</p>

    <div class="highlight-box">
      <div class="temp">160°C</div>
      <div class="time">3분</div>
    </div>

    <div class="step">
      <span class="step-num">1</span>
      에어프라이어 160도 예열
    </div>

    <div class="step">
      <span class="step-num">2</span>
      크루아상을 바스켓에 놓기 (겹치지 않게)
    </div>

    <div class="step">
      <span class="step-num">3</span>
      3분 돌리면 완성!
    </div>

    <div class="tip">
      <div class="tip-title">💡 PAPA TIP</div>
      바삭함을 원하면 30초 추가!
    </div>
  </div>
</body>
</html>`,

      tip: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀팁 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .badge {
      display: inline-block;
      background: #8B5A2B;
      color: #FFF8F0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;

      margin-bottom: 16px;
    }

    .card {
      background: #2D2420;

  </style>

<body>
  <div class="container">
    <span class="badge">꿀팁</span>
    <h1>💡 에어프라이어 활용 팁</h1>
    <p>40년 제빵 경험에서 얻은 노하우를 공유합니다.</p>
    <div class="card">
      <h3>🔥 온도 가이드</h3>
      <ul>
        <li>식빵류: 170°C, 2분</li>
        <li>크루아상: 160°C, 3분</li>
        <li>고로케: 180°C, 5분</li>
        <li>바게트: 180°C, 4분</li>
      </ul>
    </div>
    <div class="card">
      <h3>✨ 바삭함의 비결</h3>
      <p>기름 스프레이를 살짝 뿌리면 갓 튀긴 것처럼!</p>
    </div>
  </div>
</body>
</html>`,

      blank: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제목 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #E8A54B; margin-bottom: 20px; }
  </style>

<body>
  <div class="container">
    <h1>제목</h1>
    <p>내용</p>
  </div>

</html>`
    };

    function loadTemplate(name, btn) {
      // Update active state
      document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      editor.value = templates[name];
      updatePreview();

      // Auto filename
      const names = { recipe: 'new-recipe', tip: 'new-tip', blank: 'new-page' };
      filenameInput.value = names[name] || 'new-page';
    }

    function openGitHubUpload() {
      const filename = filenameInput.value.trim();
      if (!filename) {
        alert('파일명을 입력하세요!');
        filenameInput.focus();
        return;
      }

      if (!/^[a-z0-9-]+$/.test(filename)) {
        alert('영문 소문자, 숫자, 하이픈(-)만!');
        filenameInput.focus();
        return;
      }

      // Copy to clipboard
      navigator.clipboard.writeText(editor.value).then(() => {
        showToast('✅ 복사됨! GitHub에서 붙여넣기');
        setTimeout(() => {
          window.open(`https://github.com/dtslib1979/papafly/new/main/pages?filename=${filename}.html`, '_blank');
        }, 800);
      }).catch(() => {
        // Fallback
        editor.select();
        document.execCommand('copy');
        showToast('✅ 복사됨! GitHub에서 붙여넣기');
        setTimeout(() => {
          window.open(`https://github.com/dtslib1979/papafly/new/main/pages?filename=${filename}.html`, '_blank');
        }, 800);
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Init
    loadTemplate('recipe', document.querySelector('.template-btn'));
  </script>
</body>
</html>
