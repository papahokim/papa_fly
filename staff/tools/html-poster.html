<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML 포스팅 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep: #1A1410;
      --bg-card: #2D2420;
      --bg-input: #1a1a1a;
      --highlight: #E8A54B;
      --accent: #8B5A2B;
      --text-primary: #FFF8F0;
      --text-muted: #A89080;
      --success: #4ade80;
      --border: #3d3530;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.5rem;
      color: var(--highlight);
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--highlight);
    }

    /* Main Layout */
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: calc(100vh - 200px);
      min-height: 500px;
    }

    @media (max-width: 900px) {
      .editor-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    /* Panels */
    .panel {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: var(--bg-input);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .panel-body {
      flex: 1;
      overflow: auto;
    }

    /* Editor */
    #html-editor {
      width: 100%;
      height: 100%;
      min-height: 400px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: none;
      padding: 16px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    #html-editor::placeholder {
      color: var(--text-muted);
    }

    /* Preview */
    #preview-frame {
      width: 100%;
      height: 100%;
      min-height: 400px;
      border: none;
      background: #fff;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--highlight);
      color: var(--bg-deep);
    }

    .btn-primary:hover {
      background: #f0b55c;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--highlight);
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-success:hover {
      background: #22c55e;
    }

    /* File Name Input */
    .filename-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .filename-group label {
      color: var(--text-muted);
      white-space: nowrap;
    }

    #filename {
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      width: 250px;
    }

    #filename:focus {
      outline: none;
      border-color: var(--highlight);
    }

    .filename-ext {
      color: var(--text-muted);
    }

    /* Template Buttons */
    .templates {
      margin-bottom: 20px;
    }

    .templates-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .template-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .template-btn {
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .template-btn:hover {
      border-color: var(--highlight);
      color: var(--highlight);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: #000;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Instructions */
    .instructions {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .instructions h3 {
      color: var(--highlight);
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .instructions ol {
      padding-left: 20px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .instructions code {
      background: var(--bg-input);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--highlight);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>📝 HTML 포스팅</h1>
      <a href="../../" class="back-link">← 홈으로</a>
    </header>

    <!-- Templates -->
    <div class="templates">
      <div class="templates-title">템플릿 선택:</div>
      <div class="template-btns">
        <button class="template-btn" onclick="loadTemplate('recipe')">🍞 레시피</button>
        <button class="template-btn" onclick="loadTemplate('tip')">💡 꿀팁</button>
        <button class="template-btn" onclick="loadTemplate('blank')">📄 빈 페이지</button>
      </div>
    </div>

    <!-- Editor Layout -->
    <div class="editor-layout">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">HTML 코드</span>
          <button class="template-btn" onclick="copyHTML()">복사</button>
        </div>
        <div class="panel-body">
          <textarea id="html-editor" placeholder="여기에 HTML을 붙여넣으세요..."></textarea>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">미리보기</span>
          <button class="template-btn" onclick="refreshPreview()">새로고침</button>
        </div>
        <div class="panel-body">
          <iframe id="preview-frame"></iframe>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="filename-group">
        <label>파일명:</label>
        <input type="text" id="filename" placeholder="my-recipe" pattern="[a-z0-9-]+" />
        <span class="filename-ext">.html</span>
      </div>
      <button class="btn btn-secondary" onclick="downloadHTML()">💾 다운로드</button>
      <button class="btn btn-primary" onclick="openGitHubUpload()">🚀 GitHub에 업로드</button>
    </div>

    <!-- Instructions -->
    <div class="instructions">
      <h3>📋 사용 방법</h3>
      <ol>
        <li>왼쪽에 HTML 코드를 붙여넣거나 템플릿 선택</li>
        <li>오른쪽에서 실시간 미리보기 확인</li>
        <li>파일명 입력 (영문, 숫자, 하이픈만)</li>
        <li><strong>"GitHub에 업로드"</strong> 버튼 클릭</li>
        <li>GitHub 페이지에서 <code>Commit changes</code> 클릭하면 끝!</li>
      </ol>
    </div>
  </div>

  <div class="toast" id="toast">복사 완료!</div>

  <script>
    const editor = document.getElementById('html-editor');
    const preview = document.getElementById('preview-frame');
    const filenameInput = document.getElementById('filename');
    const toast = document.getElementById('toast');

    // Live preview
    let debounceTimer;
    editor.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 300);
    });

    function updatePreview() {
      const html = editor.value;
      const previewDoc = preview.contentDocument || preview.contentWindow.document;
      previewDoc.open();
      previewDoc.write(html);
      previewDoc.close();
    }

    function refreshPreview() {
      updatePreview();
    }

    // Templates
    const templates = {
      recipe: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레시피 제목 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .badge {
      display: inline-block;
      background: #E8A54B;
      color: #1A1410;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #E8A54B;
    }
    .meta {
      color: #A89080;
      margin-bottom: 30px;
    }
    .highlight-box {
      background: rgba(232, 165, 75, 0.15);
      border: 2px solid #E8A54B;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin: 30px 0;
    }
    .temp { font-size: 2.5rem; font-weight: 700; color: #E8A54B; }
    .time { font-size: 1.2rem; color: #A89080; margin-top: 8px; }
    .step {
      background: #2D2420;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
    }
    .step-num {
      background: #E8A54B;
      color: #1A1410;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-right: 12px;
    }
    .tip {
      background: rgba(139, 90, 43, 0.3);
      border-left: 4px solid #8B5A2B;
      padding: 16px 20px;
      border-radius: 0 12px 12px 0;
      margin: 30px 0;
    }
    .tip-title { color: #E8A54B; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">에어프라이어</span>
    <h1>🥐 크루아상 리히팅</h1>
    <p class="meta">PAPA FLY 시그니처 레시피</p>

    <div class="highlight-box">
      <div class="temp">160°C</div>
      <div class="time">3분</div>
    </div>

    <div class="step">
      <span class="step-num">1</span>
      에어프라이어 160도 예열
    </div>

    <div class="step">
      <span class="step-num">2</span>
      크루아상을 바스켓에 놓기 (겹치지 않게)
    </div>

    <div class="step">
      <span class="step-num">3</span>
      3분 돌리면 완성!
    </div>

    <div class="tip">
      <div class="tip-title">💡 PAPA TIP</div>
      바삭함을 원하면 30초 추가!
    </div>
  </div>
</body>
</html>`,

      tip: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀팁 제목 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .badge {
      display: inline-block;
      background: #8B5A2B;
      color: #FFF8F0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #E8A54B;
    }
    p {
      line-height: 1.8;
      margin-bottom: 20px;
      color: #FFF8F0;
    }
    .card {
      background: #2D2420;
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
    }
    .card h3 {
      color: #E8A54B;
      margin-bottom: 12px;
    }
    ul {
      padding-left: 20px;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">꿀팁</span>
    <h1>💡 에어프라이어 활용 팁</h1>

    <p>40년 제빵 경험에서 얻은 노하우를 공유합니다.</p>

    <div class="card">
      <h3>🔥 온도 가이드</h3>
      <ul>
        <li>식빵류: 170°C, 2분</li>
        <li>크루아상: 160°C, 3분</li>
        <li>고로케: 180°C, 5분</li>
        <li>바게트: 180°C, 4분</li>
      </ul>
    </div>

    <div class="card">
      <h3>✨ 바삭함의 비결</h3>
      <p>기름 스프레이를 살짝 뿌리면 갓 튀긴 것처럼!</p>
    </div>
  </div>
</body>
</html>`,

      blank: `<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제목 | PAPA FLY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #1A1410 0%, #2D2420 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #E8A54B; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>제목을 입력하세요</h1>
    <p>내용을 입력하세요...</p>
  </div>
</body>
</html>`
    };

    function loadTemplate(name) {
      editor.value = templates[name];
      updatePreview();

      // Auto-generate filename
      if (name === 'recipe') filenameInput.value = 'new-recipe';
      else if (name === 'tip') filenameInput.value = 'new-tip';
      else filenameInput.value = 'new-page';
    }

    function copyHTML() {
      editor.select();
      document.execCommand('copy');
      showToast('복사 완료!');
    }

    function downloadHTML() {
      const filename = filenameInput.value.trim() || 'untitled';
      const blob = new Blob([editor.value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + '.html';
      a.click();
      URL.revokeObjectURL(url);
      showToast('다운로드 완료!');
    }

    function openGitHubUpload() {
      const filename = filenameInput.value.trim();
      if (!filename) {
        alert('파일명을 입력하세요!');
        filenameInput.focus();
        return;
      }

      if (!/^[a-z0-9-]+$/.test(filename)) {
        alert('파일명은 영문 소문자, 숫자, 하이픈(-)만 사용하세요!');
        filenameInput.focus();
        return;
      }

      // Copy HTML to clipboard first
      editor.select();
      document.execCommand('copy');

      // Open GitHub new file page
      const githubUrl = `https://github.com/dtslib1979/papafly/new/main/pages?filename=${filename}.html`;

      showToast('HTML 복사됨! GitHub에서 붙여넣기 하세요');

      setTimeout(() => {
        window.open(githubUrl, '_blank');
      }, 500);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Load default template
    loadTemplate('recipe');
  </script>
</body>
</html>
