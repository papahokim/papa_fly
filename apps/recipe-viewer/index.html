<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1A1410" />
  <title>레시피 — papafly</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; margin-bottom: 1.5rem;">
      <div>
        <h1 class="site-title" style="font-size: 1.25rem;">🍞 레시피</h1>
        <p class="text-muted" style="font-size: 0.85rem;">아버지의 손맛</p>
      </div>
      <a href="../../" class="btn btn-ghost">← 메인</a>
    </header>

    <div id="recipe-list" class="grid gap-sm"></div>

    <!-- Recipe Detail Modal -->
    <div id="recipe-modal" class="hidden" style="position: fixed; inset: 0; background: var(--bg-deep); z-index: 100; overflow-y: auto;">
      <div class="container">
        <button id="close-modal" class="btn btn-ghost mb-md" style="margin-top: 1rem;">← 목록으로</button>
        <div id="recipe-detail"></div>
      </div>
    </div>
  </div>

  <script>
    const recipeList = document.getElementById('recipe-list');
    const recipeModal = document.getElementById('recipe-modal');
    const recipeDetail = document.getElementById('recipe-detail');
    const closeModal = document.getElementById('close-modal');

    async function loadRecipes() {
      try {
        const res = await fetch('../../data/registry.json');
        const data = await res.json();

        if (!data.recipes || data.recipes.length === 0) {
          recipeList.innerHTML = '<p class="text-muted">등록된 레시피가 없습니다.</p>';
          return;
        }

        recipeList.innerHTML = data.recipes.map(recipe => `
          <div class="card" style="cursor: pointer;" onclick="showRecipe('${recipe.path}')">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <span style="font-size: 3rem;">🥟</span>
              <div>
                <h3 style="font-size: 1.1rem; margin-bottom: 0.25rem;">${recipe.name}</h3>
                <p class="text-muted" style="font-size: 0.85rem;">${recipe.category}</p>
                ${recipe.featured ? '<span class="badge badge-gold mt-sm">시그니처</span>' : ''}
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        recipeList.innerHTML = '<p class="text-muted">레시피를 불러올 수 없습니다.</p>';
      }
    }

    async function showRecipe(path) {
      try {
        const res = await fetch('../../data/' + path);
        const recipe = await res.json();

        recipeDetail.innerHTML = `
          <h1 class="site-title mb-sm">${recipe.name}</h1>
          <p class="text-muted mb-lg">${recipe.description}</p>

          <div class="card card-highlight mb-lg">
            <h3 class="text-gold mb-md" style="font-size: 1rem;">🌡️ 에어프라이어 리히팅</h3>
            <div style="display: flex; gap: 2rem; margin-bottom: 0.5rem;">
              <div>
                <span class="text-gold" style="font-size: 1.75rem; font-weight: 700;">${recipe.reheat.temp}°C</span>
                <p class="text-muted" style="font-size: 0.75rem;">온도</p>
              </div>
              <div>
                <span class="text-gold" style="font-size: 1.75rem; font-weight: 700;">${recipe.reheat.time}분</span>
                <p class="text-muted" style="font-size: 0.75rem;">시간</p>
              </div>
            </div>
            <p class="text-muted" style="font-size: 0.85rem;">💡 ${recipe.reheat.tip}</p>
          </div>

          <div class="card mb-lg">
            <h3 class="mb-md" style="font-size: 1rem;">📝 재료</h3>
            <ul style="list-style: none;">
              ${recipe.ingredients.map(ing => `
                <li style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                  <span>${ing.name}</span>
                  <span class="text-muted">${ing.amount}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="card mb-lg">
            <h3 class="mb-md" style="font-size: 1rem;">👨‍🍳 조리법</h3>
            <ol style="padding-left: 1.5rem; line-height: 2;" class="text-muted">
              ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
            </ol>
          </div>

          <div class="card">
            <h3 class="mb-md" style="font-size: 1rem;">💰 원가 정보</h3>
            <div class="grid grid-2 gap-sm">
              <div>
                <p class="text-muted" style="font-size: 0.75rem;">재료비</p>
                <p style="font-size: 1.1rem;">₩${recipe.cost.ingredients.toLocaleString()}</p>
              </div>
              <div>
                <p class="text-muted" style="font-size: 0.75rem;">개당 원가</p>
                <p style="font-size: 1.1rem;">₩${recipe.cost.unit_cost?.toLocaleString() || '-'}</p>
              </div>
              <div>
                <p class="text-muted" style="font-size: 0.75rem;">판매가</p>
                <p class="text-gold" style="font-size: 1.1rem;">₩${recipe.cost.unit_price?.toLocaleString() || '-'}</p>
              </div>
              <div>
                <p class="text-muted" style="font-size: 0.75rem;">마진율</p>
                <p style="font-size: 1.1rem;">${(recipe.cost.margin * 100)}%</p>
              </div>
            </div>
          </div>
        `;

        recipeModal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } catch (e) {
        alert('레시피를 불러올 수 없습니다.');
      }
    }

    closeModal.addEventListener('click', () => {
      recipeModal.classList.add('hidden');
      document.body.style.overflow = '';
    });

    loadRecipes();
  </script>
</body>
</html>
